name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ glslang-tools
      - name: GX to aurora bridge tests
        run: sh tests/bridge/run.sh
      - name: Python tool tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end smoke test
        run: sh tests/smoke.sh
